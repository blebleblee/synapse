name: Build Portable Windows Binary

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            app/frontend/package-lock.json
            app/desktop/package-lock.json

      - name: Build React Frontend SPA
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Compile Backend Sidecar (synapse.exe)
        run: |
          pyinstaller --clean --noconfirm --distpath dist/bin synapse.spec

      - name: Package Electron Portable Windows App
        working-directory: app/desktop
        run: |
          npm ci
          npm run build:win

      - name: Assemble Portable Windows Distribution
        run: |
          mkdir -p dist/Synapse-Portable-Windows
          cp dist/desktop/*.exe dist/Synapse-Portable-Windows/
          echo "Place curriculum 'topics/' folder alongside this executable." > dist/Synapse-Portable-Windows/README.txt

      - name: Upload Windows Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Synapse-Workbench-Portable-Windows
          path: dist/Synapse-Portable-Windows/
