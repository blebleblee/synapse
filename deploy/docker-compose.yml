services:
  workbench:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: learning-workbench
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_HOSTS=${OLLAMA_HOSTS:-http://host.docker.internal:11434}
    volumes:
      - ../topics:/workspace/topics
      - ../exports:/workspace/exports
