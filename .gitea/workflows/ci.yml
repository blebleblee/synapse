# CI on the Gitea runner: full verification, release-pack guard and secret
# scan on every push and pull request. Change `runs-on` if the runner was
# registered with other labels (act_runner's default is `ubuntu-latest`).
name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Vite's bundler (Rolldown) ships a native binary that dies with
      # "Illegal instruction" on CPUs below x86-64-v3 (this runner: Ivy
      # Bridge). There, use its WebAssembly build: slower, same output.
      - name: Check CPU level
        run: |
          grep -m1 'model name' /proc/cpuinfo || true
          levels=$(/lib64/ld-linux-x86-64.so.2 --help 2>/dev/null | grep -E 'x86-64-v[0-9]' || true)
          echo "$levels"
          if ! echo "$levels" | grep -q 'x86-64-v3 (supported'; then
            echo "No x86-64-v3: the bundler will use its WebAssembly build."
            echo "NAPI_RS_FORCE_WASI=true" >> "$GITHUB_ENV"
          fi
      # The image's own Python, not actions/setup-python: its prebuilt Python
      # for this Ubuntu needs a newer x86 ISA level than the runner's CPU
      # ("CPU ISA level is lower than required").
      - name: Python from the runner image
        run: |
          if ! python3 -c 'import venv, ensurepip' 2>/dev/null; then
            apt-get update -qq && apt-get install -y -qq python3 python3-venv
          fi
          python3 -m venv .venv
          .venv/bin/python --version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Python environment
        run: |
          .venv/bin/python -m pip install -q -r requirements.txt pytest httpx playwright pytest-playwright
          .venv/bin/python -m playwright install --with-deps chromium
      - name: Install frontend dependencies
        run: |
          cd app/frontend && npm ci
          # The WebAssembly bundler must match Rolldown's version exactly.
          node -e "const a = require('rolldown/package.json').version, b = require('@rolldown/binding-wasm32-wasi/package.json').version; if (a !== b) { console.error('Update @rolldown/binding-wasm32-wasi to ' + a + ' (it is ' + b + ')'); process.exit(1) }"
      - name: Verify (unit, lint, build, backend, E2E)
        run: ./scripts/verify_all.sh

  release-packs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # The image's own Python, not actions/setup-python: its prebuilt Python
      # for this Ubuntu needs a newer x86 ISA level than the runner's CPU
      # ("CPU ISA level is lower than required").
      - name: Python from the runner image
        run: |
          if ! python3 -c 'import venv, ensurepip' 2>/dev/null; then
            apt-get update -qq && apt-get install -y -qq python3 python3-venv
          fi
          python3 -m venv .venv
          .venv/bin/python --version
      - name: Build packs and check them for private content
        run: |
          .venv/bin/python -m pip install -q -r requirements.txt
          out="$RUNNER_TEMP/packs"
          .venv/bin/python - "$out" <<'EOF'
          import sys
          from pathlib import Path
          from learning_engine.packages import CORE_DOMAINS, TOPICS_DIR, export_topic_pack
          out = Path(sys.argv[1])
          for d in CORE_DOMAINS:
              if (TOPICS_DIR / d).is_dir():
                  export_topic_pack(d, output_dir=out)
          export_topic_pack("complete", output_dir=out)
          EOF
          .venv/bin/python scripts/check_release_packs.py "$out"/*.synpack

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan pushed commits with gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          # Only the new commits: older history holds a known, accepted finding.
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$SHA"
          else
            range="-1 $SHA"
          fi
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="$range" .
