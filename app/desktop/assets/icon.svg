<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1c2128" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <linearGradient id="synapse-grad" x1="60" y1="60" x2="452" y2="452" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#39c5cf" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark macOS Squircle Background -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bg-grad)" stroke="rgba(255,255,255,0.12)" stroke-width="2.5"/>

  <!-- Centered Synapse Logo -->
  <g transform="translate(16, 16) scale(10)">
    <!-- Outer Orbit -->
    <circle cx="24" cy="24" r="20" stroke="url(#synapse-grad)" stroke-width="1.8" stroke-dasharray="4 2" opacity="0.6"/>

    <!-- Geometric Hexagonal Core -->
    <polygon points="24,8 38,16 38,32 24,40 10,32 10,16" stroke="url(#synapse-grad)" stroke-width="2.2" fill="#161b22" />

    <!-- Neural Connecting Vectors -->
    <line x1="24" y1="8" x2="24" y2="24" stroke="#58a6ff" stroke-width="2" />
    <line x1="38" y1="16" x2="24" y2="24" stroke="#39c5cf" stroke-width="2" />
    <line x1="38" y1="32" x2="24" y2="24" stroke="#3fb950" stroke-width="2" />
    <line x1="24" y1="40" x2="24" y2="24" stroke="#3fb950" stroke-width="2" />
    <line x1="10" y1="32" x2="24" y2="24" stroke="#58a6ff" stroke-width="2" />
    <line x1="10" y1="16" x2="24" y2="24" stroke="#39c5cf" stroke-width="2" />

    <!-- Central Luminous Spark -->
    <circle cx="24" cy="24" r="4.5" fill="#3fb950" filter="url(#glow)"/>
    <circle cx="24" cy="24" r="2.5" fill="#f0f6fc"/>

    <!-- Satellite Nodes -->
    <circle cx="24" cy="8" r="2.5" fill="#58a6ff"/>
    <circle cx="38" cy="16" r="2.5" fill="#39c5cf"/>
    <circle cx="38" cy="32" r="2.5" fill="#3fb950"/>
    <circle cx="24" cy="40" r="2.5" fill="#3fb950"/>
    <circle cx="10" cy="32" r="2.5" fill="#58a6ff"/>
    <circle cx="10" cy="16" r="2.5" fill="#39c5cf"/>
  </g>
</svg>
